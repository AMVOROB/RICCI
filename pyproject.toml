[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ricci"
version = "0.1.0"
description = "Когнитивное ядро ИИ-личности (Шрёдингер-Риччи над смыслами)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "networkx>=3.2",
    "psutil>=5.9",
]

[tool.setuptools.packages.find]
where = ["src"]